[project]
name = "premier-plan-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.7",
    "fpdf2>=2.8",
    "google-genai>=3.5.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.34",
    "rapidfuzz>=3.14.6",
    "structlog>=26.1.0",
    "supabase>=2.34.1",
    "tzdata>=2025.1",
    "uvicorn[standard]>=0.54.0",
    "reportlab>=5.1.0",
    "c2pa-python>=0.39.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.65.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
# Le dossier supabase/ (migrations SQL) ne doit pas faire passer la lib supabase pour un module local.
known-third-party = ["supabase"]
