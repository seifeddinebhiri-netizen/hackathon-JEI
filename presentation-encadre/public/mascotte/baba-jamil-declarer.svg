<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 320 290" width="320" height="290" role="img" aria-label="Baba Jamil"><title>Baba Jamil</title><style>.bob{animation:bob 1.4s ease-in-out infinite alternate}
.blink{animation:blink 4s infinite}
.clap{animation:clap 2.6s infinite}
.lift{animation:lift .5s ease-in-out infinite alternate}
.talk{animation:talk .25s steps(2) infinite alternate}
.wave{animation:wave .6s ease-in-out infinite alternate}
.rec{animation:rec 1s steps(2) infinite}
@keyframes bob{to{transform:translateY(-6px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes clap{0%,60%{transform:rotate(-24deg)}72%{transform:rotate(0deg)}84%,100%{transform:rotate(-24deg)}}
@keyframes lift{from{transform:rotate(-6deg)}to{transform:rotate(-26deg)}}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1.1)}}
@keyframes wave{from{transform:rotate(-15deg)}to{transform:rotate(20deg)}}
@keyframes rec{50%{opacity:.2}}
.tail{animation:tail 1.6s infinite}
.wingL{animation:wing .5s ease-in-out infinite alternate}
.wingR{animation:wing .5s ease-in-out infinite alternate}
@keyframes tail{0%,55%{transform:rotate(-28deg)}68%{transform:rotate(6deg)}80%,100%{transform:rotate(-28deg)}}
@keyframes wing{from{transform:scaleX(1)}to{transform:scaleX(.55)}}
.spin{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.zoom{animation:zoom 2.2s ease-in-out infinite alternate}
@keyframes zoom{from{transform:scale(.7)}to{transform:scale(1.25)}}
.talk{animation-name:talk2}
@keyframes talk2{from{transform:translateY(0)}to{transform:translateY(3px)}}
